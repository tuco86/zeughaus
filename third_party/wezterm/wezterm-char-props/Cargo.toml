[package]
authors = ["Wez Furlong"]
name = "zeughaus-wezterm-char-props"
version = "0.1.3"
edition = "2021"
repository = "https://github.com/tuco86/zeughaus"
description = "wezterm-char-props from wezterm at 2658f629, published for zeughaus. Unicode and other character properties"
license = "MIT"
keywords = ["terminal", "unicode", "nerdfonts", "emoji"]

[dependencies]
phf.workspace = true
serde = {workspace=true, optional=true}
ucd-trie.workspace = true

[features]
default = ["std"]
std = ["serde/std", "ucd-trie/std", "phf/std"]
use_serde = ["serde"]

[dev-dependencies]
k9.workspace = true

[[bench]]
name = "wcwidth"
harness = false

