[package]
name = "zeughaus"
version.workspace = true
edition.workspace = true

[dependencies]
zeughaus-core.workspace = true
zeughaus-runtime.workspace = true
zeughaus-transform.workspace = true
# Pure codegen plugin, no platform deps, so it is available in the wasm editor
# too (it designs ML graphs; native runners execute the exported code).
zeughaus-ml.workspace = true
# Flow primitives (Hold, future Zip/Pulse). Pure, cross-platform like ml.
zeughaus-flow.workspace = true
# Subgraph containers and their boundary nodes. Pure, cross-platform: the
# nesting is drawn here and executed nowhere.
zeughaus-graph.workspace = true
iced_nodegraph.workspace = true
iced_palette.workspace = true
serde_json = "1.0"

# Native-only: process/capture plugins (DLL injection, DXGI capture), the
# native file dialog, and the tokio executor iced needs for its timers.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zeughaus-capture.workspace = true
# SQLite tables, inserts and queries as nodes. Native only: it links SQLite and
# opens files, neither of which a browser editor can do.
zeughaus-db.workspace = true
# Frame datasets on disk. Native only: it writes files.
zeughaus-record.workspace = true
zeughaus-llm.workspace = true
rfd = "0.15"
# `image` decodes/uploads raw RGBA frames (screen capture -> Display node).
iced = { version = "0.14", features = ["advanced", "wgpu", "tokio", "image"] }
spacetimedb-sdk.workspace = true
zeughaus-sync.workspace = true
# Frames do not fit through a state store (33 MB for a 4K frame), so the video
# path is its own QUIC transport: `zeughaus-samples` is the wire format, `weida`
# the transport, and `tokio::io` reads a frame off the stream. The QUIC runtime
# itself is iced's tokio executor, which every feed task already runs on.
zeughaus-samples.workspace = true
weida.workspace = true
# `io-util` reads a frame off the QUIC stream, `time` backs off between redials.
tokio = { version = "1", features = ["io-util", "time"] }

# wasm: iced without the tokio executor (iced uses the wasm-bindgen executor).
# iced_nodegraph is WebGPU-only, so the browser editor needs a WebGPU context.
[target.'cfg(target_arch = "wasm32")'.dependencies]
iced = { version = "0.14", features = ["advanced", "wgpu", "image"] }
console_error_panic_hook = "0.1"
spacetimedb-sdk = { workspace = true, features = ["browser"] }
