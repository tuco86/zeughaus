[package]
name = "zeughaus"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Visual dataflow workbench on iced: the editor, which edits the node graph and shows what a runner reports"
keywords = ["dataflow", "node-graph", "iced", "workbench", "visual-programming"]
categories = ["gui", "visualization", "development-tools"]

[features]
# The headless editor: `zeughaus --headless --control <socket>` runs the real
# app without a window, takes input over a Unix socket, writes screenshots and
# records video through an external `ffmpeg`, and `zeughaus ctl <socket> ...`
# drives it. Native only; off by default.
remote = ["dep:iced_runtime", "dep:iced_futures", "dep:iced_selector"]

[dependencies]
zeughaus-core.workspace = true
zeughaus-transform.workspace = true
# Pure codegen plugin, no platform deps, so it is available in the wasm editor
# too (it designs ML graphs; native runners execute the exported code).
zeughaus-ml.workspace = true
# Flow primitives (Hold, future Zip/Pulse). Pure, cross-platform like ml.
zeughaus-flow.workspace = true
# Subgraph containers and their boundary nodes. Pure, cross-platform: the
# nesting is drawn here and executed nowhere.
zeughaus-graph.workspace = true
# Job nodes: the argv, environment and artifact globs of a process, drawn and
# edited here and executed by a runner. Pure settings and pins, so the wasm
# editor registers the same detached plugin the native one does.
zeughaus-job.workspace = true
# The terminal mux's wire model: the workspace topology the editor rebuilds
# its pane grid from, and the terminal cache it draws. Pure types, so the
# wasm editor deserializes the same topology as the native one.
zeughaus-mux.workspace = true
iced_nodegraph.workspace = true
iced_palette.workspace = true
iced_tabs.workspace = true
serde_json = "1.0"

# Native-only: process/capture plugins (DLL injection, DXGI capture), the
# native file dialog, and the tokio executor iced needs for its timers.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zeughaus-capture.workspace = true
# SQLite tables, inserts and queries as nodes. Native only: it links SQLite and
# opens files, neither of which a browser editor can do.
zeughaus-db.workspace = true
# Frame datasets on disk. Native only: it writes files.
zeughaus-record.workspace = true
zeughaus-llm.workspace = true
rfd = "0.15"
# `image` decodes/uploads raw RGBA frames (screen capture -> Display node).
# `canvas` draws the node header's button symbols as paths.
iced = { version = "0.14", features = ["advanced", "wgpu", "tokio", "image", "canvas"] }
# The link to the runners: `zeughaus-link` is the protocol (the graph
# document, frames, events), `weida` the transport, and `tokio::io` reads a
# frame off the stream. The QUIC runtime itself is iced's tokio executor,
# which every feed task already runs on.
zeughaus-link.workspace = true
weida.workspace = true
# The terminal surface: draws a `TerminalView` with one wgpu primitive per
# pane and bundles the font the grid is measured from.
iced_terminal.workspace = true
# `io-util` reads a frame off the QUIC stream, `time` paces the first dial of a
# runtime, `macros` is `select!` between a subscription and its peer events,
# `signal` is the SIGUSR1 that restarts the editor.
tokio = { version = "1", features = ["io-util", "time", "macros", "signal"] }
# Sixteen random bytes, once per process, for the `ClientInstanceId` a control
# lease is bound to. Already in the tree under weida; a full `rand` would be a
# generator this process has no other use for.
getrandom = "0.4"
# What the editor looks like: one theme type behind every widget, the node
# graph, the tab bar and the terminals. The `terminal` feature is what turns a
# scheme into a terminal palette, and only the native editor draws one.
zeughaus-theme = { workspace = true, features = ["terminal"] }
# `editor.toml` under the state directory: the theme and where the tab bar
# sits. A browser tab has no state directory and therefore no preferences.
toml = { workspace = true }
serde = { workspace = true }
# The headless host (feature `remote`). Direct dependencies because `iced`
# keeps its runtime private, and the host drives `UserInterface` and the
# subscription `Runtime` itself.
iced_runtime = { version = "0.14", optional = true }
iced_futures = { version = "0.14", features = ["tokio"], optional = true }
iced_selector = { version = "0.14", optional = true }
# Decodes the bundled window icon, and writes the screenshots the headless
# host takes. Already in the tree under iced's `image` feature.
png = "0.18"
# A terminal's OSC 9/777 notification as a desktop notification (the
# freedesktop service over zbus, which the tree already has with tokio;
# the platform's own API on macOS and Windows).
notify-rust = { version = "4.18", default-features = false, features = ["z-with-tokio"] }
# A terminal hyperlink the user explicitly activated, opened by the
# platform's handler (`xdg-open`, `open`, `start`).
open = "5.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# `#[tokio::test]` for the first-dial schedule, with a paused clock.
tokio = { version = "1", features = ["rt", "macros", "test-util"] }

# wasm: iced without the tokio executor (iced uses the wasm-bindgen executor).
# iced_nodegraph is WebGPU-only, so the browser editor needs a WebGPU context.
[target.'cfg(target_arch = "wasm32")'.dependencies]
iced = { version = "0.14", features = ["advanced", "wgpu", "image", "canvas"] }
console_error_panic_hook = "0.1"
# The pack is the whole choice in the browser: no state directory, so no file
# themes and nothing to persist.
zeughaus-theme = { workspace = true }
