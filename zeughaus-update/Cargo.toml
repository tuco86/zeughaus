[package]
name = "zeughaus-update"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The zeughaus self-updater: signed release manifests and the install of a published build"

[dependencies]
# A release's manifest is signed with Ed25519 (`ring`) and lists every
# archive by size and SHA-256 (`sha2`, `hex`).
ring = "0.17"
sha2 = "0.11"
hex = "0.4"
serde.workspace = true
serde_json = "1"
# `update.toml`.
toml.workspace = true

[target.'cfg(unix)'.dependencies]
# `SIGUSR1` to the editors an update replaced, and the mask that says whether
# one catches it.
libc = "0.2"
