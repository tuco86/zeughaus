[package]
name = "zeughaus-job"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "zeughaus plugin: Job runs a process in a runner-owned terminal and keeps a log per run"

[dependencies]
zeughaus-core.workspace = true
# Artifacts are declared as globs relative to the run's working directory and
# expanded after the process exited.
glob = "0.3"
# The command and the env are single-line settings split the way a shell
# splits words, without a shell: quotes group, nothing expands.
shlex = "1.3"
