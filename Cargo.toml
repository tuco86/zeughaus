[workspace]
members = [
    "zeughaus",
    "zeughaus-core",
    "zeughaus-runtime",
    "zeughaus-transform",
    "zeughaus-process",
    "zeughaus-capture",
]
# zeughaus-module is a SpacetimeDB server module: it only builds for the
# wasm32 module target via `spacetime build`, so it is kept out of the native
# workspace build.
exclude = ["zeughaus-module"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
zeughaus-core = { path = "zeughaus-core" }
zeughaus-runtime = { path = "zeughaus-runtime" }
zeughaus-transform = { path = "zeughaus-transform" }
zeughaus-process = { path = "zeughaus-process" }
zeughaus-capture = { path = "zeughaus-capture" }

iced = { version = "0.14", features = ["advanced", "wgpu", "tokio"] }
iced_nodegraph = "0.1.0"
iced_palette = { git = "https://github.com/tuco86/iced_palette.git", branch = "main" }

serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

# SpacetimeDB client SDK. Native uses default (tokio) features; wasm enables the
# `browser` feature in the per-target deps of the zeughaus binary.
spacetimedb-sdk = "2.6"
