[workspace]
members = [
    "iced_tabs",
    "iced_terminal",
    "zeughaus",
    "zeughaus-core",
    "zeughaus-runtime",
    "zeughaus-transform",
    "zeughaus-capture",
    "zeughaus-llm",
    "zeughaus-ml",
    "zeughaus-flow",
    "zeughaus-graph",
    "zeughaus-db",
    "zeughaus-record",
    "zeughaus-sync",
    "zeughaus-link",
    "zeughaus-runner",
    "zeughaus-mux",
    "zeughaus-terminal",
]
# zeughaus-module is a SpacetimeDB server module: it only builds for the
# wasm32 module target via `spacetime build`, so it is kept out of the native
# workspace build.
exclude = ["zeughaus-module"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
zeughaus-core = { path = "zeughaus-core" }
zeughaus-runtime = { path = "zeughaus-runtime" }
zeughaus-transform = { path = "zeughaus-transform" }
zeughaus-capture = { path = "zeughaus-capture" }
zeughaus-llm = { path = "zeughaus-llm" }
zeughaus-ml = { path = "zeughaus-ml" }
zeughaus-flow = { path = "zeughaus-flow" }
zeughaus-graph = { path = "zeughaus-graph" }
zeughaus-db = { path = "zeughaus-db" }
zeughaus-record = { path = "zeughaus-record" }
zeughaus-sync = { path = "zeughaus-sync" }
# What travels between a runner and its editors over weida, and the identities
# both ends present: the sample feed, runtime events, path constants and the
# credentials on disk. Frames are streams, and a state store is the wrong pipe
# for 33 MB per frame, so this is its own transport. The QUIC transport itself
# lives in a sibling checkout.
zeughaus-link = { path = "zeughaus-link" }
weida = { path = "../weida/crates/weida" }
zeughaus-runner = { path = "zeughaus-runner" }
# The terminal multiplexer's wire model, shared by runner and editor (wasm
# included): pure types and a bounded codec, nothing that opens a PTY or draws.
zeughaus-mux = { path = "zeughaus-mux" }
# The runner's terminal engine: PTYs from `portable-pty`, escape parsing and
# the canonical screen from a pinned `wezterm-term` -- the parts of WezTerm that
# are a terminal, without its mux, client, GUI, Lua or configuration stack.
zeughaus-terminal = { path = "zeughaus-terminal" }
portable-pty = "0.9.0"
wezterm-term = { git = "https://github.com/wezterm/wezterm", rev = "2658f629cd7251ce63a1698f238da2585676aa4e", default-features = false }
termwiz = { git = "https://github.com/wezterm/wezterm", rev = "2658f629cd7251ce63a1698f238da2585676aa4e", default-features = false }
# Compact self-describing serde bytes for the mux frames.
postcard = { version = "1.1", features = ["use-std"] }

iced = { version = "0.14", features = ["advanced", "wgpu", "tokio"] }
iced_nodegraph = { path = "../iced_nodegraph/iced_nodegraph" }
iced_tabs = { path = "iced_tabs" }
# The terminal surface: one widget, one wgpu primitive per pane, drawing a
# `zeughaus_mux::view::TerminalView`. Its own crate so the pipeline compiles
# and tests apart from the editor.
iced_terminal = { path = "iced_terminal" }
iced_palette = { git = "https://github.com/tuco86/iced_palette.git", branch = "main" }

# `rc` provides Serialize/Deserialize for Arc<str> / Arc<T>, which pin names,
# node ids and the runtime type system (Ty) use to stay cheap to clone.
serde = { version = "1.0", features = ["derive", "rc"] }
thiserror = "2.0"

# SpacetimeDB client SDK. Native uses default (tokio) features; wasm enables the
# `browser` feature in the per-target deps of the zeughaus binary.
spacetimedb-sdk = "2.10"

# Profiles apply from the top-level workspace being built, so iced_nodegraph's
# own `profile.dev` is ignored when it is a path dependency here. Without this,
# `cargo run` builds iced/wgpu/lyon/nodegraph at opt-level 0 and large graphs
# (500+ nodes) stutter. Optimize dependencies while keeping our own crates cheap
# to recompile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
