[package]
name = "zeughaus-link"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The zeughaus runner-to-editor protocol over weida: sample feed, events, snapshot, triggers and credentials"

[dependencies]
zeughaus-core.workspace = true
serde = { workspace = true }
serde_json = "1.0"
# The transport whose credentials `credentials` manages: identities, trust and
# the fingerprints a pinned URL carries are weida's types, so the files on disk
# are written and read as weida sees them and nothing translates in between.
weida.workspace = true
