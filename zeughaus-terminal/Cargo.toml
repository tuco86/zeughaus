[package]
name = "zeughaus-terminal"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The runner's terminal engine: a PTY, a parser and a canonical screen per session, delivered as mux rows and deltas"

[dependencies]
zeughaus-mux.workspace = true
portable-pty.workspace = true
wezterm-term.workspace = true
termwiz.workspace = true
wezterm-input-types.workspace = true
tokio = { version = "1", features = ["sync", "rt", "macros"] }
# The shim's frames and its spec file.
serde.workspace = true
postcard.workspace = true
serde_json = "1"

[target.'cfg(unix)'.dependencies]
# fork/setsid for the shim, SIGWINCH to a PTY's foreground group.
libc = "0.2"

[dev-dependencies]
# `time` only for the two PTY tests: they bound how long they wait on a real
# child instead of hanging a suite.
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
