[package]
name = "zeughaus-runner"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The headless zeughaus process that executes the node graph and owns the terminals"

[dependencies]
zeughaus-core.workspace = true
zeughaus-runtime.workspace = true
# The runner<->editor protocol over weida and the credentials both ends present.
# Shared with the editor so the two ends cannot disagree about it.
zeughaus-link.workspace = true
# Every plugin the editor offers natively must be instantiable here: the editor
# only draws a node, this process is the one that runs it. A node type missing
# from the runner is a node that silently never executes.
zeughaus-transform.workspace = true
zeughaus-capture.workspace = true
zeughaus-llm.workspace = true
zeughaus-ml.workspace = true
zeughaus-flow.workspace = true
zeughaus-graph.workspace = true
zeughaus-db.workspace = true
zeughaus-record.workspace = true
# Jobs: the node type, and the `ProcessHost` this process implements over its
# mux so a run is a terminal it owns.
zeughaus-job.workspace = true
# The link's transport: the graph document, frames and events leave this
# process over QUIC.
weida.workspace = true
# The terminal multiplexer: `zeughaus-mux` is the wire model every editor
# shares, `zeughaus-terminal` the PTYs and screens only this process holds.
zeughaus-mux.workspace = true
zeughaus-terminal.workspace = true
# `workspace.json` and the graph files under `graphs/`: the tabs, splits,
# terminals and graphs a restarted runner brings back.
serde.workspace = true
serde_json = "1"
# Blocking node work (LLM requests, screen capture) runs on tokio's blocking
# pool so the event loop keeps applying graph changes. Multi-threaded because the
# feed server's tasks live here too: they park on QUIC flow control and scale
# frames, which is milliseconds of CPU that must not sit in front of quinn's
# driver.
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    # Stopping drains: the signal that used to kill this process now holds it
    # and waits for the live runs.
    "signal",
] }
# CI: `ci.toml` and the `.zeughaus-ci` job headers, webhook signatures (hmac and sha2
# share one `digest` major), the hook's HTTP intake, cron schedules in the
# local time zone, and the basic-auth header a mirror fetch presents.
toml.workspace = true
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
tiny_http = "0.12"
croner = "4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(unix)'.dependencies]
# The restart signal's handler: an atomic flag the event loop reads.
libc = "0.2"
