[package]
name = "zeughaus-runner"
version.workspace = true
edition.workspace = true

[dependencies]
zeughaus-core.workspace = true
zeughaus-runtime.workspace = true
zeughaus-sync.workspace = true
# The wire format of the sample feed. Shared with the editor so the two ends
# cannot disagree about the protocol.
zeughaus-samples.workspace = true
# Every plugin the editor offers natively must be instantiable here: the editor
# only draws a node, this process is the one that runs it. A node type missing
# from the runner is a node that silently never executes.
zeughaus-transform.workspace = true
zeughaus-capture.workspace = true
zeughaus-llm.workspace = true
zeughaus-ml.workspace = true
zeughaus-flow.workspace = true
zeughaus-graph.workspace = true
zeughaus-db.workspace = true
# Frames leave this process over QUIC, not through the store: a 4K RGBA frame
# is 33 MB and a state store is the wrong pipe for it.
weida.workspace = true
# Blocking node work (LLM requests, screen capture) runs on tokio's blocking
# pool so the event loop keeps draining the store. Multi-threaded because the
# feed server's tasks live here too: they park on QUIC flow control and scale
# frames, which is milliseconds of CPU that must not sit in front of quinn's
# driver.
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
] }
