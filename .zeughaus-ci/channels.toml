# Release channels of zeughaus. The first channel whose `on` matches an
# event names the pipeline's channel; publish.sh puts the build of a push to
# main on `dev` (what installed runners update from), a nightly build on
# `nightly` and a tagged one on `release`. The last two are `clean`: what
# they publish is built from empty workspaces, not from warm caches.
[[channel]]
name = "dev"
on = ["push main"]

[[channel]]
name = "nightly"
on = ["cron *"]
clean = true

[[channel]]
name = "release"
on = ["tag v*"]
clean = true
