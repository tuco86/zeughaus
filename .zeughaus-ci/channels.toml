# Release channels of zeughaus. The first channel whose `on` matches an
# event names the pipeline's channel; publish.sh puts the build of a push to
# main on `dev` (what installed runners update from), a nightly build on
# `nightly` and a tagged one on `release`. `nightly` has `daily_cleanup`:
# the pipeline the CI's nightly round starts begins each workspace from
# nothing, once a day, so `target/` cannot grow across days of development.
# A nightly queued by hand, a rerun and a release build on what is there.
[[channel]]
name = "dev"
on = ["push main"]

[[channel]]
name = "nightly"
on = ["nightly"]
daily_cleanup = true

[[channel]]
name = "release"
on = ["tag v*"]
