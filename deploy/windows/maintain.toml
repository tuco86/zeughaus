# Maintenance tasks of the wohnzimmer runner; `zeughaus-runner install windows`
# writes this from the release to C:\zeughaus\state\maintain.toml, and every
# update rewrites it. See zeughaus-runner/src/maintain.rs.

[[task]]
name = "rust"
command = ['C:\zeughaus\cargo\bin\rustup.exe', 'update']
every_minutes = 60
timeout_minutes = 60
