[package]
name = "zeughaus-llm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "zeughaus plugin: conversation nodes against an LM Studio endpoint"

[dependencies]
zeughaus-core.workspace = true
# Blocking HTTP client (pure Rust, no async runtime) for LM Studio's
# OpenAI-compatible local endpoint. Keeps execute() synchronous like the
# other native plugins.
ureq = { version = "2.12", features = ["json"] }
serde = { workspace = true }
serde_json = "1.0"
